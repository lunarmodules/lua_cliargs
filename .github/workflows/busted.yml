name: Busted

on: [ push, pull_request ]

permissions: read-all

jobs:

  busted:
    strategy:
      fail-fast: false
      matrix:
        luaVersion: [ "5.5", "5.4", "5.3", "5.2", "5.1", "luajit" ] # , "luajit-openresty"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup ‘lua’
        uses: luarocks/gh-actions-lua@85e2287697275df96334743ac654241a8fd34ab3 # v13
        with:
          luaVersion: ${{ matrix.luaVersion }}

      - name: Setup ‘luarocks’
        uses: luarocks/gh-actions-luarocks@95d2308a0aff36ad31ebadca493ed14853399842 # v7

      - name: Setup test dependencies
        run: |
          luarocks install --deps-only lua_cliargs-dev-1.rockspec
          luarocks install busted
          luarocks install dkjson
          luarocks install inifile
          luarocks install lyaml

      - name: Replace system cliargs with self
        run: |
          luarocks remove --force lua_cliargs
          luarocks make

      - name: Run regression tests
        # disable project-local path prefixes to force use of system installation
        run: busted -v --lpath="" --cpath="" -Xoutput --color
